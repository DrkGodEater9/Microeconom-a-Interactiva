<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Guía interactiva de microeconomía por capítulos, con gráficas que se pueden tocar y mover."
    />
    <title>Microeconomía interactiva</title>
    <meta name="theme-color" content="#161b24" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <a class="skip" href="#main">Saltar al contenido</a>
    <header class="topbar">
      <button
        class="iconbtn menu-btn"
        id="menuBtn"
        type="button"
        aria-label="Mostrar u ocultar el índice de capítulos"
        aria-controls="side"
      >
        ☰ Capítulos
      </button>
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 3v18h18" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M5 6c5 1 9 6 15 13" fill="none" stroke="var(--blue)" stroke-width="2.2" />
          <path d="M5 18c5-1 9-6 15-13" fill="none" stroke="var(--red)" stroke-width="2.2" />
        </svg>
        <span>Microeconomía interactiva</span>
      </a>
      <span class="sp"></span>
      <button
        class="iconbtn"
        id="themeBtn"
        type="button"
        aria-label="Cambiar entre modo claro y oscuro"
      >
        ◐ Tema
      </button>
    </header>
    <div class="shell">
      <nav class="side" id="side" aria-label="Capítulos">
        <div class="side-search">
          <input
            id="searchInput"
            type="search"
            placeholder="Buscar en la guía…"
            aria-label="Buscar en la guía"
            autocomplete="off"
          />
        </div>
        <div id="navlinks"></div>
        <div id="searchRes" hidden></div>
      </nav>
      <main id="main" tabindex="-1"></main>
    </div>
    <div class="scrim" id="scrim"></div>
    <div class="fab" id="fab" hidden>
      <nav class="secpanel" id="secpanel" aria-label="Secciones del capítulo" hidden></nav>
      <button
        class="iconbtn"
        id="secBtn"
        type="button"
        aria-expanded="false"
        aria-controls="secpanel"
      >
        ☰ Secciones
      </button>
      <button class="iconbtn" id="topBtn" type="button" aria-label="Volver arriba">↑</button>
    </div>
    <noscript>Esta guía necesita JavaScript para mostrar las gráficas interactivas.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
